# Limites fixos de CPU e memória para a medição com docker stats.
name: tcc-suporte

services:
  qdrant:
    image: qdrant/qdrant:v1.14.1
    container_name: tcc-qdrant
    ports:
      - "6333:6333"                       # REST
      - "6334:6334"                       # gRPC (Spring AI)
    volumes:
      - qdrant_storage:/qdrant/storage
    cpus: 1.0
    mem_limit: 1g
    memswap_limit: 1g                     # sem swap
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: ./app
    container_name: tcc-app
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Defina OPENAI_API_KEY no arquivo .env}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini-2024-07-18}
      QDRANT_HOST: qdrant
      APP_KB_PATH: /data/kb
      APP_METRICS_CSV_PATH: /data/metrics/requests.csv
      JAVA_TOOL_OPTIONS: >-
        -XX:+UseG1GC -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError
    volumes:
      - ./data/kb:/data/kb:ro
      - ./output/metrics:/data/metrics
    cpus: 2.0
    mem_limit: 1536m
    memswap_limit: 1536m

volumes:
  qdrant_storage:
